<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Glitch Interface - Simulated Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="trading-container">
        <!-- Background Cyber Grid & Watermark -->
        <div class="glitch-bg">
            <div class="radar-circle"></div>
            <h1 class="watermark-text">BASE GLITCH</h1>
        </div>

        <!-- Live Trade Signal Log Overlay -->
        <div class="signal-log-container" id="signalLog">
            <!-- Dynamic popups will appear here -->
        </div>

        <!-- Bot Floating Control Panel -->
        <div class="glitch-panel">
            <div class="panel-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <h3>⚡ Base Glitch Bot</h3>
            </div>
            <div class="panel-body">
                <div class="input-group">
                    <label>Target Level</label>
                    <input type="text" value="1325.00" readonly>
                </div>
                <div class="input-group">
                    <label>Multiplier / Steps</label>
                    <input type="text" value="3" readonly>
                </div>
                <button class="activate-btn" id="glitchToggle">Activate Base Glitch</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
